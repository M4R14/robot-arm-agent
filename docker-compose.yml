services:
  sim:
    build: ./robot-arm
    networks:
      - control
    restart: unless-stopped
    # No ports: mapping — sim is reachable only from agent, over the
    # internal "control" network, by service name.

  agent:
    build: ./ai-agent
    networks:
      - control
      - egress
    environment:
      SIM_URL: http://sim:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    depends_on:
      sim:
        condition: service_healthy
    stdin_open: true
    tty: true

networks:
  control:
    driver: bridge
    internal: true
  egress:
    driver: bridge
