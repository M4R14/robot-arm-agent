services:
  sim:
    build: ./robot-arm
    networks:
      - control
    restart: unless-stopped
    # No ports: mapping — sim is reachable only from agent, over the
    # internal "control" network, by service name.
    volumes:
      # sim-exclusive; never mounted into agent, so this doesn't weaken
      # the isolation boundary. Holds only pose_facts.json — a rough
      # "have I tried around here before" cache keyed by URDF path (see
      # POSE_MEMORY_* in constants.py), the one deliberate exception to
      # sim's otherwise fully ephemeral state.
      - sim_memory:/data

  agent:
    build: ./ai-agent
    networks:
      - control
      - egress
    environment:
      SIM_URL: http://sim:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # Optional: run orchestrator.js's Planner on a different (e.g.
      # cheaper/faster) model than the default in settings.json, which
      # the Executor always uses. Unset means both use the default.
      PLANNER_MODEL: ${PLANNER_MODEL:-}
    depends_on:
      sim:
        condition: service_healthy
    stdin_open: true
    tty: true
    volumes:
      # agent-exclusive; never mounted into sim, so this doesn't weaken
      # the isolation boundary in the other direction from sim_memory
      # above. Holds only orchestrator.js's run_history.jsonl — one line
      # per orchestrator.js invocation (task, steps, replans, cost,
      # outcome) for a human to audit afterwards via `docker compose
      # exec agent cat /data/run_history.jsonl`. Not read by any LLM.
      - agent_logs:/data

networks:
  control:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  sim_memory:
  agent_logs:
